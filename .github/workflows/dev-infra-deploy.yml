name: 'Pipeline infraestructura Terraform'

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'terraform/**'
  #     - '.github/workflows/dev-infra-deploy.yml'
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - 'terraform/**'
  workflow_dispatch: 
    
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: 'Terraform Plan & Validate'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: \${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: \${{ secrets.AZURE_TENANT_ID }}
          subscription-id: \${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        # Se guarda la salida del plan en un archivo de texto plano
        run: |
          terraform plan -var-file="dev-vars.tfvars" -no-color > plan_output.txt
          cat plan_output.txt
        continue-on-error: false

      - name: Post Plan to PR

        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Leemos el archivo generado en el paso anterior dentro de la carpeta de trabajo
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            
            const output = `#### Estructura del Plan Terraform 🚀
            
            <details><summary>🔍 Haz clic aquí para ver el Plan Completo</summary>
            
            \`\`\`terraform
            \${plan}
            \`\`\`
            
            </details>
            
            *Triggered by: @${context.actor}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: \${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: \${{ secrets.AZURE_TENANT_ID }}
          subscription-id: \${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -var-file="dev-vars.tfvars" -auto-approve -input=false
