name: 'Pipeline Build, Push y Deploy App'

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'app/**'
  #     - '.github/workflows/dev-app-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: 'acrgaleria'  
  ACR_SERVER_NAME: 'acrgaleria-byhrhhhwefffcqen.azurecr.io'
  ACA_RESOURCE_GROUP: 'rg-galeria-arte'

jobs:
  build-backend:
    name: 'Build & Push Backend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Backend Image
        run: |
          ACR_SERVER=${{ env.ACR_SERVER_NAME }}
          docker build -t $ACR_SERVER/galeria-backend:${{ github.sha }} -t $ACR_SERVER/galeria-backend:latest ./app/backend
          docker push $ACR_SERVER/galeria-backend:${{ github.sha }}
          docker push $ACR_SERVER/galeria-backend:latest

  build-frontend:
    name: 'Build & Push Frontend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Frontend Image
        run: |
          ACR_SERVER=${{ env.ACR_SERVER_NAME }}
          docker build -t $ACR_SERVER/galeria-frontend:${{ github.sha }} -t $ACR_SERVER/galeria-frontend:latest ./app/frontend
          docker push $ACR_SERVER/galeria-frontend:${{ github.sha }}
          docker push $ACR_SERVER/galeria-frontend:latest

  deploy:
    name: 'Deploy to Azure Container Apps'
    runs-on: ubuntu-latest

    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Backend to Container App
        run: |
          az containerapp update \
            --name aca-backend-dev-galeria-arte \
            --resource-group ${{ env.ACA_RESOURCE_GROUP }} \
            --image ${{ env.ACR_SERVER_NAME }}/galeria-backend:${{ github.sha }}

      - name: Deploy Frontend to Container App
        run: |
          az containerapp update \
            --name aca-frontend-dev-galeria-arte \
            --resource-group ${{ env.ACA_RESOURCE_GROUP }} \
            --image ${{ env.ACR_SERVER_NAME }}/galeria-frontend:${{ github.sha }}
