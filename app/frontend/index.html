<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería de Arte DevOps</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; }
        .galeria { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .cuadro { background: white; padding: 10px; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .cuadro img { width: 150px; height: 150px; object-fit: cover; border-radius: 4px; }
        #detalle { margin-top: 30px; font-size: 1.2em; color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Mi Galería de Arte</h1>
    <p>Haz clic en una pintura para consultar sus detalles a la Base de Datos a través del Backend:</p>
    
    <div class="galeria">
        <div class="cuadro" onclick="consultarBD(1)">
            <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Leonardo_da_Vinci_-_Mona_Lisa_%28Louvre%2C_Paris%29.jpg/250px-Leonardo_da_Vinci_-_Mona_Lisa_%28Louvre%2C_Paris%29.jpg?utm_source=es.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" alt="Mona Lisa">
            <h3>Mona Lisa</h3>
        </div>
        <div class="cuadro" onclick="consultarBD(2)">
            <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/250px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg?utm_source=commons.wikimedia.org&utm_campaign=parser&utm_content=thumbnail" alt="Noche Estrellada">
            <h3>La Noche Estrellada</h3>
        </div>
        <div class="cuadro" onclick="consultarBD(3)">
            <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/The_Scream.jpg/250px-The_Scream.jpg?utm_source=es.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" alt="Noche Estrellada">
            <h3>La Noche Estrellada</h3>
        </div>
    </div>

    <div id="detalle">Haz clic en un cuadro...</div>

    <script>

        async function consultarBD(id) {
            const detalleDiv = document.getElementById('detalle');
            detalleDiv.innerText = "Consultando al backend y BD...";
            try {
                const respuesta = await fetch(`/api/pintura/${id}`);
                const datos = await respuesta.json();
                
                // Tu consulta SQL "SELECT * FROM cuadros" puede devolver un array de filas
                const cuadro = Array.isArray(datos) ? datos[0] : datos;

                if (cuadro && cuadro.autor) {
                    detalleDiv.innerHTML = `🎨 <strong>Autor:</strong> ${cuadro.autor} | 📅 <strong>Año:</strong> ${cuadro.anio || cuadro.year || 'Desconocido'}`;
                } else {
                    detalleDiv.innerText = "Error al traer los datos (cuadro vacío).";
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                detalleDiv.innerText = "No se pudo conectar con el Backend.";
            }
        }
    </script>
</body>
</html>
